/* One config object. Nothing is hardcoded elsewhere. Empty links and addresses are simply not shown. */
window.LOOT_CONFIG = {
  name: "LOOT", ticker: "$LOOT",
  mint: "",            // contract address. Empty hides everything that needs it.
  x: "", telegram: "", repo: "", dexscreener: "",   // empty = button/link hidden
  rpc: "https://api.mainnet-beta.solana.com",
  rpcFallbacks: ["https://solana-rpc.publicnode.com"],   // tried in order when rpc refuses browsers (the public Solana node does)
  api: "",             // optional backend that mirrors votes
  quorumPct: 1,        // % of supply that must vote for quorum
  verdict: { solidMinLiquidityUsd: 25000, thinLiquidityUsd: 5000 },
  features: { sound: false, rugcheck: false, intro: true, seedVotes: true }   // seedVotes: starter numbers on the vote cards (off for a real launch)
};
</script>
<script>

(function () {
  var d = document.documentElement;

    var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    var seen = sessionStorage.getItem("loot:intro") === "1";
    var home = !location.hash || location.hash === "#" || location.hash === "#/";
    if (on && !reduced && !seen && home) {
      d.classList.add("intro-on");
      window.introDone = new Promise(function (r) { window.__introResolve = r; });
      return;
    }
  } catch (e) { /* storage blocked: no intro, no flash */ }
  window.introDone = Promise.resolve();
})();

<style>
:root{
  --night:#0d0b14; --wall:#1a1424; --torch:#e8892b; --gold:#f0b424; --gold2:#ffe066; --cream:#fff3d6; --ink:#1a0d12;
  --line:#3a2f52; --muted:#c3b9d8; --ok:#5fc65f; --warn:#f0b424; --bad:#e0463f; --cant:#8b8499;
  --display:"Pixelify Sans", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --body:"DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --bar:56px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--cream);font-family:var(--body);font-size:16px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:var(--gold2)}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0}
p{margin:0 0 .6em}
code{font-family:var(--mono);font-size:.9em;word-break:break-all}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.fx{image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated;display:block;max-width:none;width:calc(var(--w) * var(--s) * 1px);height:calc(var(--h) * var(--s) * 1px)}
@media (max-width:600px){.fx{width:calc(var(--w) * var(--sm) * 1px);height:calc(var(--h) * var(--sm) * 1px)}}

/* ---------- layers: scene < pages < top bar < transitions < intro HUD < modal < toasts ---------- */
#scene{position:fixed;inset:0;z-index:0;background:var(--night)}
#scene canvas{display:block;width:100%;height:100%}
#pages{position:fixed;inset:0;z-index:10;pointer-events:none}
#topbar{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:16px;min-height:var(--bar);padding:8px 16px;background:linear-gradient(180deg,rgba(13,11,20,.96),rgba(13,11,20,.82));border-bottom:2px solid var(--line)}
#fxlayer{position:fixed;inset:0;z-index:30;pointer-events:none}
.transition{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;pointer-events:none}
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(8,6,14,.72);opacity:0;transition:opacity .15s}
.modal.in{opacity:1}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,480px)}
.toast{background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:10px 14px;box-shadow:0 4px 0 var(--ink);opacity:0;transform:translateY(8px);transition:.25s;font-weight:500}
.toast.in{opacity:1;transform:none}

/* ---------- top bar ---------- */
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--gold2);font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:.04em}
.brand img{image-rendering:pixelated;display:block}
.nav{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.pill{display:inline-block;text-decoration:none;color:var(--cream);font-family:var(--display);font-size:16px;padding:6px 14px;border:2px solid var(--line);border-radius:999px;background:rgba(26,20,36,.8);white-space:nowrap}
.pill:hover,.pill.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.tools{display:flex;align-items:center;gap:10px;margin-left:auto}
.icon{font-family:var(--mono);font-size:12px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer}
.icon[aria-pressed="true"]{color:var(--gold2);border-color:var(--gold)}
.walletbox{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);display:flex;flex-direction:column;background:var(--wall);border:2px solid var(--line);border-radius:12px;min-width:160px;overflow:hidden;z-index:2}
.menu button{background:none;border:0;color:var(--cream);text-align:left;padding:10px 14px;font:inherit;cursor:pointer}
.menu button:hover{background:var(--line)}

/* ---------- buttons, fields, cards ---------- */
.btn{display:inline-block;font-family:var(--display);font-size:18px;font-weight:700;line-height:1.1;text-decoration:none;text-align:center;padding:12px 18px;border:3px solid var(--ink);border-radius:14px;background:var(--cream);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--gold)}
.btn.ghost{background:var(--wall);color:var(--cream);border-color:var(--cream);box-shadow:0 4px 0 rgba(255,243,214,.35)}
.cream .btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.btn.small{font-size:15px;padding:8px 12px;border-width:2px;border-radius:10px;box-shadow:0 3px 0 var(--ink)}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 0}
.linklike{background:none;border:0;color:var(--gold2);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
.card{background:rgba(26,20,36,.94);border:2px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.card.cream{background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--torch)}
.card.cream a{color:#8a3d0b}
input[type=text]{width:100%;font:inherit;font-family:var(--mono);color:var(--cream);background:var(--night);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
input[type=text]:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(240,180,36,.35)}
label{font-weight:700;display:block;margin-bottom:6px}
.help,.footnote{color:var(--muted);font-size:14px}
.error{color:#ff9a92;font-weight:500}
.banner,.notice{background:rgba(232,137,43,.14);border:2px solid var(--torch);border-radius:12px;padding:10px 14px;color:var(--cream);pointer-events:auto}
.notice{margin:8px 16px}
.notice.small{font-size:13px;padding:6px 10px}
.badge{display:inline-block;font-family:var(--display);font-size:22px;font-weight:700;padding:6px 16px;border:3px solid var(--ink);border-radius:999px;color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.badge.solid{background:var(--ok)}.badge.shaky{background:var(--warn)}.badge.nogo{background:var(--bad);color:#fff}.badge.cant{background:var(--cant)}

/* ---------- pages ---------- */
.page{position:absolute;inset:0;pointer-events:auto;overflow-y:auto;overflow-x:hidden;padding:calc(var(--bar) + 12px) 0 0;-webkit-overflow-scrolling:touch;background:linear-gradient(180deg,rgba(13,11,20,.95),rgba(13,11,20,.98))}
.page:focus{outline:none}
.page.enter .wrap,.page.enter .home-inner{animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.wrap{width:100%;max-width:1000px;margin:0 auto;padding:20px 16px 28px}
.page-title{font-size:clamp(30px,5vw,46px);color:var(--gold2);margin-bottom:6px}
.page-sub{color:var(--muted);font-size:18px}
h2.sub{font-size:26px;margin:28px 0 12px;color:var(--gold2)}

/* ---------- home ---------- */
.page.home{display:flex;flex-direction:column;background:none;pointer-events:none}
.page.home>*{pointer-events:none}
.page.home .title-card,.page.home .footer,.page.home .btn,.page.home .stage-ui,.page.home .notice,.page.home a,.page.home button,.page.home .padlabel{pointer-events:auto}
.home-inner{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;padding:8px 16px 0}
.title-card{width:100%;max-width:720px;padding:18px 24px 20px;text-align:center}
.eyebrow{font-family:var(--mono);font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:#7a3a0a;margin-bottom:6px}
.title-card h1{font-size:clamp(30px,6.2vw,56px);margin-bottom:10px}
.title-card h1 em{font-style:italic;color:#b3500f}
.lede{font-size:clamp(15px,2vw,18px);max-width:56ch;margin:0 auto 4px}
.title-card .btnrow{justify-content:center}
.safety{margin:10px 0 0;font-size:13px;color:var(--muted);text-align:center;text-shadow:0 1px 2px #000}
.stage{position:relative;flex:1;width:100%;min-height:250px}
.stage-ui{position:absolute;left:50%;top:62%;transform:translate(-50%,44px);width:max-content;max-width:100%;text-align:center;z-index:2}
.hint{font-family:var(--mono);font-size:13px;color:var(--gold2);text-shadow:0 1px 3px #000;margin-bottom:4px}
.counter{position:relative;display:inline-block;white-space:nowrap;font-family:var(--display);font-size:19px;color:var(--cream);background:rgba(13,11,20,.75);border:2px solid var(--line);border-radius:999px;padding:3px 14px;margin:0}
.counter-fx{position:absolute;left:50%;top:calc(62% - 30px);pointer-events:none;z-index:3}
.counter-fx .fx{margin:calc(-102 * var(--s) * 1px) 0 0 calc(-60 * var(--s) * 1px)}
.no-3d .stage{display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.no-3d .stage-ui{position:static;transform:none;margin-top:8px}
.padlabel{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-size:15px;padding:3px 12px;border-radius:999px;background:rgba(13,11,20,.8);border:2px solid var(--line);color:var(--cream);text-decoration:none}
.padlabel:hover,.padlabel:focus-visible{background:var(--gold);color:var(--ink)}
.plain-stage{display:flex;align-items:flex-end;justify-content:center;gap:4px;flex-wrap:wrap;padding-top:12px}
.plain-stage .chest2d{background:none;border:0;padding:0;cursor:pointer}
.plinth-2d{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--cream);font-family:var(--display)}
.fade{animation:fadein .35s ease}
@keyframes fadein{from{opacity:.2}to{opacity:1}}

/* ---------- footer ---------- */
.footer{position:relative;margin:auto 0 0;width:100%;padding:16px 20px 14px;color:var(--muted);font-size:13px;
  background:linear-gradient(180deg,rgba(26,20,36,.96),rgba(13,11,20,.98));border-top:3px solid var(--torch);
  box-shadow:0 -6px 0 rgba(232,137,43,.16), inset 0 3px 0 rgba(255,224,102,.06)}
.footer::before{content:"";position:absolute;left:0;right:0;top:-3px;height:3px;
  background:repeating-linear-gradient(90deg,var(--torch) 0 12px,var(--gold) 12px 16px,var(--torch) 16px 28px)}
.f-main{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:14px 24px;max-width:1100px;margin:0 auto}
.f-brand{display:flex;align-items:center;gap:12px;min-width:0}
.f-brand img{image-rendering:pixelated;flex:none}
.f-brand strong{font-family:var(--display);font-size:22px;letter-spacing:.06em;color:var(--gold2);line-height:1}
.flinks{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.f-ext{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.fpill{display:inline-block;font-family:var(--display);font-size:14px;line-height:1;text-decoration:none;color:var(--cream);
  padding:7px 12px;border:2px solid var(--line);border-radius:999px;background:rgba(13,11,20,.7);cursor:pointer}
.fpill:hover,.fpill:focus-visible{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.fpill.gold{border-color:var(--torch);color:var(--gold2)}
.fpill.ghostbtn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.f-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 16px;max-width:1100px;margin:12px auto 0;
  padding:7px 12px;border:2px dashed rgba(232,137,43,.55);border-radius:10px;background:rgba(232,137,43,.08)}
.f-bar .risk{margin:0;font-size:12.5px;color:var(--cream);flex:1 1 320px}
.footer>.small{max-width:1100px;margin:10px auto 0;text-align:center;font-size:11.5px;color:var(--muted)}
.f-bar .contract{margin:0;font-family:var(--mono);font-size:12px}

/* ---------- tool ---------- */
.steps{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0;margin:18px 0}
.step{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:rgba(26,20,36,.8);opacity:.6}
.step b{grid-row:span 2;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--line);font-family:var(--display)}
.step span{font-family:var(--display);font-size:18px}
.step small{color:var(--muted);font-size:12px;line-height:1.2}
.step.on{opacity:1;border-color:var(--gold)}.step.on b,.step.done b{background:var(--gold);color:var(--ink)}.step.done{opacity:.85}
.form .row{display:flex;gap:10px}
.form .row .btn{flex:none}
.form .help{margin:8px 0 0}
.out{margin-top:20px;display:grid;gap:16px}
.empty,.cant{text-align:center;color:var(--muted)}
.reading{display:flex;align-items:center;gap:16px}
.status{font-family:var(--display);font-size:22px;color:var(--gold2);margin:0}
.chest-box{display:flex;justify-content:center;overflow:hidden;border-radius:16px;background:radial-gradient(ellipse at 50% 85%,rgba(232,137,43,.18),rgba(13,11,20,0) 70%)}
.chest-host{position:relative}
.result .sentence{font-size:20px;font-weight:500;opacity:0;transform:translateY(6px);transition:.4s}
.result .sentence.in{opacity:1;transform:none}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:14px 0}
.fact{position:relative;background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:12px 14px;box-shadow:0 4px 0 var(--ink);opacity:0;transform:translateY(10px) scale(.96);transition:opacity .25s,transform .25s}
.fact.in{opacity:1;transform:none}
.fact.open .fv{color:#a3260f}
.fl{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.07em;opacity:.7}
.fv{display:block;font-family:var(--display);font-size:24px;line-height:1.15;word-break:break-word}
.fs{font-family:var(--mono);font-size:12px;opacity:.7}
.burst{position:absolute;left:50%;top:50%;pointer-events:none;z-index:4}
.burst .fx{margin:calc(-80 * var(--s) * 1px) 0 0 calc(-56 * var(--s) * 1px)}
.dexlink{display:inline-block;margin-bottom:12px}
.late{opacity:0;transform:translateY(8px);transition:.4s}.late.in{opacity:1;transform:none}
.verdict{display:flex;align-items:center;gap:16px;margin-top:6px}
.verdict-fx{position:relative;flex:none;width:190px;height:150px;pointer-events:none}
.verdict-fx.tall{height:230px}
.verdict-fx .fx{position:absolute;left:50%;bottom:-26px;margin-left:calc(var(--w) * var(--s) * -.5px)}
.verdict-text .why{margin:8px 0 0;color:var(--muted)}
.seal h2{font-size:24px;margin-bottom:8px}
.seal-fx{display:flex;justify-content:center;margin-bottom:6px}
.sealed{font-family:var(--display);font-size:22px;color:var(--gold2)}

/* ---------- vote, board, how ---------- */
.rules{font-size:17px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.tile{background:rgba(26,20,36,.94);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.tile small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tile strong{font-family:var(--display);font-size:28px;color:var(--gold2);word-break:break-word}
.trust{margin:0 0 12px;font-size:15px}
.proposals,.loot-grid,.single{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px}
.single{grid-template-columns:minmax(0,520px)}
.proposal,.loot-item{padding:14px}
.art{display:grid;place-items:center;min-height:200px;max-height:300px;overflow:hidden;border-radius:12px;background:radial-gradient(ellipse at 50% 90%,rgba(232,137,43,.2),rgba(13,11,20,.7) 70%);margin-bottom:10px}
.proposal h3,.loot-item h3{font-size:24px;margin-bottom:4px}
.proposal h3 a{color:var(--gold2);text-decoration:none}
.desc{color:var(--muted);font-size:15px}
.bar{display:flex;height:14px;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--night)}
.bar i{display:block;height:100%}.bar i.drop{background:var(--ok)}.bar i.not{background:var(--bad)}
.caption,.quorum{font-size:13px;color:var(--muted);margin:6px 0 0}
.state{color:var(--muted);margin:10px 0 6px}.state.ok{color:var(--ok)}
.controls{margin-top:8px}
.weight{font-size:14px;color:var(--muted);margin-bottom:6px}
.sides{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.side{display:flex;align-items:center;gap:6px;margin:0;font-weight:500;padding:8px 12px;border:2px solid var(--line);border-radius:10px;cursor:pointer}
.side:has(input:checked){border-color:var(--gold);background:rgba(240,180,36,.12)}
.vote-fx{display:flex;justify-content:center;margin-bottom:6px;max-width:100%;overflow:hidden}
.back{display:inline-block;margin-bottom:12px}
.how-steps{list-style:none;padding:0;margin:20px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.how-steps .num{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--ink);font-family:var(--display);margin-bottom:8px}
.how-steps h3{font-size:24px;margin-bottom:4px}
.chips{list-style:none;display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0 0 18px}
.chips li{font-family:var(--display);font-size:18px;padding:6px 14px;border-radius:999px;background:var(--gold);color:var(--ink);border:2px solid var(--ink)}
.rules-list{padding-left:20px;margin:0}
.rules-list li{margin-bottom:6px}
.sides-yes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.sides-yes h3{font-size:22px;margin-bottom:4px}
.tabs{display:flex;gap:8px;margin:20px 0 14px}
.tab{font-family:var(--display);font-size:18px;color:var(--cream);background:rgba(26,20,36,.8);border:2px solid var(--line);border-radius:999px;padding:6px 16px;cursor:pointer}
.tab.on,.tab[aria-selected="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.chest-list{list-style:none;padding:0;margin:12px 0;display:grid;gap:10px}
.mychest{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 14px}
.mychest .btnrow{margin:0 0 0 auto}
.mychest .badge{font-size:16px;padding:2px 12px}
.credits-text{font-size:18px;max-width:70ch}
.effects-used{columns:2 260px;padding-left:20px}
.licenses summary{cursor:pointer;font-family:var(--display);font-size:20px}
.licenses pre{white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12px;color:var(--muted)}

/* ---------- modal ---------- */
.modal-card{background:var(--wall);border:3px solid var(--cream);border-radius:20px;padding:22px;width:min(100%,420px);box-shadow:8px 8px 0 var(--torch)}
.modal-card h2{font-size:28px;color:var(--gold2)}
.modal-card .sub{color:var(--muted)}
.wallets{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px}
.wallet-opt{display:flex;width:100%;justify-content:space-between;align-items:center;font:inherit;font-weight:700;color:var(--cream);background:var(--night);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.wallet-opt:hover{border-color:var(--gold)}
.wtag{font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.wtag.yes{color:var(--ok);border-color:var(--ok)}

/* INTRO:START */
html.intro-on body{overflow:hidden}
html.intro-on #pages{opacity:var(--intro-p,0);pointer-events:none}
html.intro-on #topbar{opacity:0;pointer-events:none}
html.intro-on .page.home .footer{opacity:0}
#intro-hud{position:fixed;inset:0;z-index:35;cursor:pointer;font-family:var(--mono);color:var(--cream);text-shadow:0 1px 3px #000}
.intro-title{position:absolute;left:16px;top:14px;margin:0;font-size:13px;letter-spacing:.18em}
.intro-caption{position:absolute;left:16px;top:38px;margin:0;font-size:13px;color:var(--gold2);opacity:.9}
.intro-skip{position:absolute;right:16px;bottom:16px;font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--cream);background:rgba(13,11,20,.6);border:1px solid var(--cream);border-radius:8px;padding:8px 14px;cursor:pointer}
html.intro-out #pages,html.intro-out #topbar{animation:fadein .5s ease}
/* INTRO:END */

/* ---------- small screens ---------- */
@media (max-width:760px){
  :root{--bar:96px}
  #topbar{flex-wrap:wrap;gap:6px 10px;padding:8px 12px}
  .brand{font-size:22px}
  .nav{order:3;flex:0 0 100%;justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .pill{font-size:14px;padding:5px 11px}
  .tools{margin-left:auto}
  .steps{grid-template-columns:1fr}
  .form .row{flex-direction:column}
  .title-card{padding:14px 16px}
  .verdict{flex-direction:column;align-items:flex-start}
  .stage{min-height:230px}
  .wrap{padding:14px 12px 24px}
  .f-main{grid-template-columns:1fr;justify-items:center;text-align:center}
  .f-brand{flex-direction:column;gap:6px}
  .flinks,.f-ext{justify-content:center}
  .f-bar{justify-content:center;text-align:center}
}
@media (max-width:380px){
  .btn{font-size:16px;padding:10px 12px}
  .tile strong{font-size:22px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .fade{animation:fadein .35s ease!important}
}

  runTransition(next.name === "" || next.name === "main-tool" ? "transitions/iris" : "transitions/crt-off", draw15);
}
function go(hash2) {
  if (location.hash !== hash2) location.hash = hash2;
  route();
}
ctx.go = go;
document.addEventListener("click", (e) => {
  if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const a = e.target.closest && e.target.closest('a[href^="#/"]');
  if (!a) return;
  e.preventDefault();
  sound.blip("select");
  go(a.getAttribute("href"));
});
window.addEventListener("hashchange", route);
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || e.defaultPrevented) return;
  if (modalOpen()) {
    closeModal();
    return;
  }
  if (ctx.introPlaying) return;
  if (parse(location.hash).name !== "") go("#/");
});
document.addEventListener("click", (e) => {
  const b = e.target.closest && e.target.closest("#btn-replay");
  if (!b) return;
  replayIntro();
});
async function replayIntro() {
  if (!intro() || !ctx.scene) return;
  intro().reset();
  window.introDone = new Promise((r) => {
    window.__introResolve = r;
  });
  shown = "#/";
  if (location.hash !== "#/") location.hash = "#/";
  mountPage(parse("#/"));
  startIntro();
}
function startIntro() {
  if (!intro() || !ctx.scene) {
    html.classList.remove("intro-on");
    window.__introResolve?.();
    return Promise.resolve();
  }
  ctx.introPlaying = true;
  return intro().run({ scene: ctx.scene, chest: { player: hero.chestPlayer, sprite: hero.chest } }).then(() => {
    ctx.introPlaying = false;
  });
}
function sceneLoop() {
  let last2 = performance.now();
  const frame3 = (now) => {
    const dt = Math.min(0.1, (now - last2) / 1e3);
    last2 = now;
    const s = ctx.scene;
    if (s && !document.hidden && (sceneActive || ctx.introPlaying)) {
      s.render(dt, now / 1e3);
      if (home.labels && home.el?.isConnected) {
        const sr = home.el.getBoundingClientRect();
        for (const l of home.labels) {
          const p = s.padScreen(l.dataset.pad);
          l.style.left = `${p.x - sr.left}px`;
          l.style.top = `${p.y - sr.top}px`;
        }
      }
    }
    requestAnimationFrame(frame3);
  };
  requestAnimationFrame(frame3);
}
async function boot() {
  sound.init(cfg.features.sound);
  const logoSrc2 = document.querySelector('link[rel="icon"]')?.href || "";
  buildTopbar(logoSrc2);
  hero.chest = new Sprite("pickups/chest-open", { seed: 3 });
  hero.chestPlayer = track(hero.chest, { mode: "once", autoplay: false, onDraw: chestDrawn, onDone: chestDone });
  hero.chestPlayer.still(0);
  hero.coin = new Sprite("pickups/coin-spin", {});
  hero.gem = new Sprite("pickups/gem-spin", {});
  hero.fireflies = new Sprite("weather/fireflies", {});
  hero.fog = new Sprite("weather/fog", {});
  hero.rays = new Sprite("weather/god-rays", {});
  for (const s of [hero.coin, hero.gem, hero.fireflies, hero.fog, hero.rays]) {
    const p = track(s, { mode: "loop", autoplay: !REDUCED });
    if (REDUCED) p.still(s.duration * 0.35);
    hero.loopPlayers.push(p);
  }
  let scene = null;
  try {
    scene = await createScene($("#scene"), { reduced: REDUCED, narrow: isNarrow() || isTouch() });
  } catch {
    scene = null;
  }
  if (scene) {
    scene.addSprites({ chest: hero.chest, coin: hero.coin, gem: hero.gem, fireflies: hero.fireflies, fog: hero.fog, rays: hero.rays });
    scene.on("pick", (id) => {
      if (id === "chest") openHomeChest();
      else if (id === "coin") go("#/board");
      else if (id === "gem") go("#/vote");
    });
    ctx.scene = scene;
    html.classList.add("has-3d");
    window.addEventListener("resize", placeStage);
    sceneLoop();
  } else {
    html.classList.add("no-3d");
    if (html.classList.contains("intro-on")) {
      html.classList.remove("intro-on");
      window.__introResolve?.();
    }
  }
  route();
  const wantsIntro = html.classList.contains("intro-on");
  if (wantsIntro) await startIntro();
  quietReconnect().catch(() => {
  });
  window.addEventListener("offline", () => toast(COPY.tool.errors.offline));
  html.classList.add("ready");
}
window.LOOT_STATE = { get opening() {
  return home.opening;
}, get route() {
  return ctx.route;
}, get introT() {
  return intro()?.state?.t ?? null;
}, get has3d() {
  return !!ctx.scene;
}, get chestScreen() {
  return ctx.scene?.chestScreen() ?? null;
}, get stageRect() {
  const r = home.el?.getBoundingClientRect();
  return r ? { top: r.top, h: r.height, left: r.left, w: r.width } : null;
} };
boot();

</script>
